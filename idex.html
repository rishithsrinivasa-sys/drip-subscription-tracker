<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drip – subscription tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EFEAFB;--card:#fff;--ink:#1B1340;--mute:#6B6590;--line:#E1DAF5;--pink:#FF5C7A;--mint:#14C99B;--sun:#FFC63D;--violet:#7C5CFF;--hero:#1B1340;--heroink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120D2B;--card:#1D1640;--ink:#F2EFFF;--mute:#9D96C7;--line:#2C2459;--hero:#7C5CFF;--heroink:#fff}}
:root[data-theme="dark"]{--bg:#120D2B;--card:#1D1640;--ink:#F2EFFF;--mute:#9D96C7;--line:#2C2459;--hero:#7C5CFF;--heroink:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,.big{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em}.logo i{color:var(--pink);font-style:normal}
.btn{border:0;border-radius:999px;padding:10px 18px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;background:var(--ink);color:var(--bg);transition:transform .15s}
.btn:active{transform:scale(.94)}.btn.soft{background:var(--line);color:var(--ink)}.btn.pink{background:var(--pink);color:#fff}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{background:var(--hero);color:var(--heroink);border-radius:32px;padding:28px 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--pink);opacity:.9}
.hero:before{content:"";position:absolute;right:70px;top:90px;width:90px;height:90px;border-radius:50%;background:var(--sun)}
.hero>*{position:relative;z-index:1}
.big{font-size:clamp(56px,16vw,104px);font-weight:800;letter-spacing:-.05em;line-height:1}
.big small{font-size:.32em;letter-spacing:0;font-weight:500;opacity:.8}
.sub{opacity:.85;margin:6px 0 0;max-width:30ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:rgba(255,255,255,.14);border-radius:18px;padding:10px 12px;backdrop-filter:blur(4px)}
.stat b{display:block;font:800 20px 'Bricolage Grotesque',sans-serif}.stat span{font-size:12px;opacity:.85}
.panel{background:var(--card);border-radius:24px;padding:20px;margin-top:16px;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);flex:1;min-width:130px}
input,select{width:100%;margin-top:4px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px 'DM Sans',sans-serif}
input:focus,select:focus{border-color:var(--violet);outline:0}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0 8px}
.bar div{transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}.meter div{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.3,1.2)}
.alert{background:var(--sun);color:#2B2000;border-radius:20px;padding:14px 16px;margin-top:16px;font-weight:500}
.alert b{font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 10px}.sec h2{font-size:22px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.av{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;font:800 20px 'Bricolage Grotesque',sans-serif;flex:none}
.meta{flex:1;min-width:0}.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{font-size:13px;color:var(--mute)}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--line);white-space:nowrap}
.chip.soon{background:var(--sun);color:#2B2000}.chip.now{background:var(--pink);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.price{font:800 18px 'Bricolage Grotesque',sans-serif;text-align:right}.price small{display:block;font:400 11px 'DM Sans';color:var(--mute)}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:12px;font-weight:700;padding:6px}
.x:hover{color:var(--pink)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{padding:8px 12px;border-radius:14px;background:var(--bg);font-size:13px;font-weight:700;opacity:.4;filter:grayscale(1);transition:.4s}
.badge.on{opacity:1;filter:none;background:var(--sun);color:#2B2000}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:99px;font-weight:700;transition:transform .4s cubic-bezier(.2,1.4,.4,1);z-index:10;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="wrap">
<header><div class="logo">drip<i>.</i></div><button class="btn soft" id="notif">🔔 Remind me</button></header>

<section class="hero">
  <p class="sub" id="mood">Add your first subscription to see where your money drips away.</p>
  <div class="big"><span id="mo">$0</span><small> /month</small></div>
  <div class="stats">
    <div class="stat"><b id="yr">$0</b><span>per year</span></div>
    <div class="stat"><b id="dy">$0</b><span>per day</span></div>
    <div class="stat"><b id="n30">$0</b><span>due in 30 days</span></div>
  </div>
</section>

<div id="alerts"></div>

<section class="panel">
  <h2 style="font-size:20px;margin-bottom:12px">Add a subscription</h2>
  <div class="row">
    <label>Name<input id="name" placeholder="Netflix" maxlength="30"></label>
    <label>Price<input id="price" type="number" min="0" step="0.01" placeholder="15.99" inputmode="decimal"></label>
  </div>
  <div class="row" style="margin-top:10px">
    <label>Billed<select id="cycle"><option value="m">Monthly</option><option value="y">Yearly</option><option value="w">Weekly</option></select></label>
    <label>Next renewal<input id="date" type="date"></label>
    <label>Type<select id="cat"><option>Streaming</option><option>Music</option><option>Software</option><option>Health</option><option>News</option><option>Other</option></select></label>
  </div>
  <div class="row" style="margin-top:14px;align-items:center">
    <button class="btn pink" id="add">Add subscription</button>
    <span style="font-size:13px;color:var(--mute)" id="err"></span>
  </div>
</section>

<section class="panel" id="insight" hidden>
  <h2 style="font-size:20px">Where it goes</h2>
  <div class="bar" id="bar"></div><div class="legend" id="legend"></div>
  <p id="fun" style="margin:14px 0 0;font-weight:500"></p>
  <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
    <b>Monthly budget</b>
    <label style="flex:0 0 120px;min-width:0"><input id="budget" type="number" min="0" placeholder="$ limit" inputmode="decimal" style="margin:0;padding:8px 10px"></label>
  </div>
  <div class="meter"><div id="meter" style="width:0"></div></div>
  <div id="budgetmsg" style="font-size:13px;color:var(--mute);margin-top:6px"></div>
</section>

<div class="sec"><h2>Coming up</h2><button class="btn soft" id="demo" hidden>Load examples</button></div>
<div id="list"></div>

<section class="panel">
  <h2 style="font-size:20px">Money freed <span id="freed" style="color:var(--mint)">$0</span><span style="font-size:14px;color:var(--mute)"> /year</span></h2>
  <p style="margin:4px 0 0;color:var(--mute);font-size:14px">Every subscription you cancel adds to this. Unlock all four badges.</p>
  <div class="badges" id="badges"></div>
</section>
</div>
<div class="toast" id="toast"></div>

<script>
const CATS={Streaming:'#FF5C7A',Music:'#7C5CFF',Software:'#1FB5E0',Health:'#14C99B',News:'#FFA62B',Other:'#9A93C2'};
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let subs=store.get('drip_subs',[]),freed=store.get('drip_freed',0),cancelled=store.get('drip_cancelled',0),budget=store.get('drip_budget',0);
const money=n=>'$'+(n>=100?Math.round(n).toLocaleString():n.toFixed(2));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const perMonth=s=>s.cycle==='y'?s.price/12:s.cycle==='w'?s.price*52/12:s.price;
const perYear=s=>perMonth(s)*12;
function next(s){const d=new Date(s.date+'T00:00:00'),t=today();let g=0;
  while(d<t&&g++<1000){if(s.cycle==='y')d.setFullYear(d.getFullYear()+1);else if(s.cycle==='w')d.setDate(d.getDate()+7);else d.setMonth(d.getMonth()+1)}
  return d}
const daysTo=d=>Math.round((d-today())/864e5);
const cyc={m:'month',y:'year',w:'week'};
const shown={};
function count(id,to,fmt){const el=$(id),from=shown[id]||0;shown[id]=to;const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}

function render(){
  const list=subs.map(s=>({...s,nd:next(s)})).map(s=>({...s,days:daysTo(s.nd)})).sort((a,b)=>a.days-b.days);
  const mo=subs.reduce((a,s)=>a+perMonth(s),0);
  count('#mo',mo,n=>money(n));count('#yr',mo*12,money);count('#dy',mo*12/365,money);
  const due=list.filter(s=>s.days<=30).reduce((a,s)=>a+s.price,0);count('#n30',due,money);
  $('#mood').textContent=!subs.length?'Add your first subscription to see where your money drips away.':mo<30?'Lean and tidy. Nice.':mo<100?'Adds up, doesn\'t it?':'That\'s a lot of drips. Time for a trim?';
  $('#demo').hidden=!!subs.length;
  $('#insight').hidden=!subs.length;
  // list
  $('#list').innerHTML=list.length?list.map(s=>{
    const c=CATS[s.cat]||CATS.Other,cls=s.days<=0?'now':s.days<=3?'soon':'';
    const txt=s.days===0?'Today!':s.days===1?'Tomorrow':'In '+s.days+' days';
    return `<div class="item"><div class="av" style="background:${c}">${esc(s.name[0].toUpperCase())}</div>
    <div class="meta"><b>${esc(s.name)}</b><span>${s.nd.toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${s.cat}</span></div>
    <span class="chip ${cls}">${txt}</span>
    <div class="price">${money(s.price)}<small>/${cyc[s.cycle]}</small><button class="x" data-c="${s.id}">Cancel 🎉</button></div></div>`}).join('')
    :'<div class="empty">Nothing here yet.<br>Fill in the form above and watch the total grow.</div>';
  // alerts
  const rd=3;const soon=list.filter(s=>s.days<=rd);
  $('#alerts').innerHTML=soon.length?`<div class="alert">⏰ <b>Heads up:</b> ${soon.map(s=>`${esc(s.name)} renews ${s.days===0?'today':s.days===1?'tomorrow':'in '+s.days+' days'} (${money(s.price)})`).join(' · ')}. Cancel now if you don't need it.</div>`:'';
  // breakdown
  if(subs.length){
    const by={};subs.forEach(s=>by[s.cat]=(by[s.cat]||0)+perMonth(s));
    const ents=Object.entries(by).sort((a,b)=>b[1]-a[1]);
    $('#bar').innerHTML=ents.map(([k,v])=>`<div title="${k}" style="width:${v/mo*100}%;background:${CATS[k]}"></div>`).join('');
    $('#legend').innerHTML=ents.map(([k,v])=>`<span><i style="background:${CATS[k]}"></i>${k} ${money(v)}</span>`).join('');
    const top=[...subs].sort((a,b)=>perMonth(b)-perMonth(a))[0];
    const pizzas=Math.max(1,Math.round(mo*12/18));
    $('#fun').innerHTML=`👑 <b>${esc(top.name)}</b> is your priciest at ${money(perMonth(top))}/mo. Your year of subscriptions equals about <b>${pizzas} pizzas</b> 🍕.`;
    const pct=budget?mo/budget:0;
    $('#meter').style.width=Math.min(100,pct*100)+'%';
    $('#meter').style.background=pct>1?'var(--pink)':pct>.8?'var(--sun)':'var(--mint)';
    $('#budgetmsg').textContent=budget?(pct>1?`Over by ${money(mo-budget)}. Cancel one to get back on track.`:`${money(budget-mo)} of headroom. You're in control. 💪`):'Set a limit to get a progress meter.';
  }
  // freed + badges
  count('#freed',freed,money);
  const B=[['🌱','First drip',subs.length>=1],['🔍','Audit: 3+ tracked',subs.length>=3],['✂️','Cancel crusher',cancelled>=1],['💎','$100/yr freed',freed>=100]];
  $('#badges').innerHTML=B.map(b=>`<span class="badge ${b[2]?'on':''}">${b[0]} ${b[1]}</span>`).join('');
  store.set('drip_subs',subs);store.set('drip_freed',freed);store.set('drip_cancelled',cancelled);
  return list;
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}

// confetti
const cv=$('#cv'),cx=cv.getContext('2d');let ps=[],raf;
function fit(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',fit);fit();
function boom(x=innerWidth/2,y=innerHeight/2){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<90;i++){const a=Math.random()*6.28,v=4+Math.random()*9;
    ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:3+Math.random()*5,c:Object.values(CATS)[i%6],l:90+Math.random()*40,rot:Math.random()*6})}
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  ps=ps.filter(p=>p.l-->0);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.rot+=.15;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  raf=ps.length?requestAnimationFrame(tick):null}

// events
$('#date').value=iso(new Date(Date.now()+7*864e5));
$('#add').onclick=e=>{
  const name=$('#name').value.trim(),price=parseFloat($('#price').value),date=$('#date').value;
  if(!name||!(price>=0)||isNaN(price)||!date){$('#err').textContent='Add a name, price and renewal date.';return}
  $('#err').textContent='';
  subs.push({id:Date.now()+''+Math.random().toString(36).slice(2,5),name,price,cycle:$('#cycle').value,date,cat:$('#cat').value});
  $('#name').value='';$('#price').value='';
  const r=e.target.getBoundingClientRect();boom(r.left+r.width/2,r.top);
  render();toast(subs.length===1?'🌱 First one tracked!':`✅ ${name} added. ${subs.length} tracked.`);
};
$('#list').onclick=e=>{const id=e.target.dataset.c;if(!id)return;
  const s=subs.find(x=>x.id===id);if(!s)return;
  const y=perYear(s);freed+=y;cancelled++;subs=subs.filter(x=>x.id!==id);
  const r=e.target.getBoundingClientRect();boom(r.left,r.top);
  render();toast(`🎉 Cancelled ${s.name}. You keep ${money(y)} a year!`)};
$('#budget').value=budget||'';
$('#budget').oninput=e=>{budget=parseFloat(e.target.value)||0;store.set('drip_budget',budget);render()};
$('#demo').onclick=()=>{const d=n=>iso(new Date(Date.now()+n*864e5));
  subs=[['Netflix',15.49,'m',2,'Streaming'],['Spotify',11.99,'m',9,'Music'],['iCloud+',2.99,'m',14,'Software'],['Gym',39,'m',5,'Health'],['Adobe',239.88,'y',60,'Software']]
  .map((a,i)=>({id:'d'+i,name:a[0],price:a[1],cycle:a[2],date:d(a[3]),cat:a[4]}));render();boom();toast('Examples loaded. Try cancelling one!')};

// reminders
function notify(list){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const seen=store.get('drip_seen',{});
  list.filter(s=>s.days<=3&&seen[s.id+s.nd]!==1).forEach(s=>{
    try{new Notification(`${s.name} renews ${s.days===0?'today':s.days===1?'tomorrow':'in '+s.days+' days'}`,{body:`${money(s.price)} will be charged.`});seen[s.id+s.nd]=1}catch(e){}});
  store.set('drip_seen',seen)}
$('#notif').onclick=async()=>{
  try{const p=await Notification.requestPermission();
    toast(p==='granted'?'🔔 Reminders on. We\'ll nudge you 3 days before renewals.':'Notifications are blocked. The yellow banner still warns you.');
    if(p==='granted')notify(render())}
  catch(e){toast('Your browser can\'t send notifications. The yellow banner still warns you.')}};
const first=render();notify(first);setInterval(()=>notify(render()),36e5);
</script>
</body>
</html>
